:root{color-scheme:light dark;--bg:#fff;--ink:#0f2a44;--muted:#5b6f84;--line:#e3eef6;--edge:#c7e3f5;--soft:#f3f8fc;--accent:#0369a1;--sky1:#38bdf8;--sky2:#0284c7;--act1:#0284c7;--act2:#075985;--tint:#e0f2fe;--tint-line:#bae6fd;--tint-ink:#075985;--risk:#a35a0b;--sun:#fdba74;--ring:rgba(56,189,248,.22);--lift:rgba(2,132,199,.10)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:transparent;color:var(--ink);font:13px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
main{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:14px 16px;width:100%;box-shadow:0 1px 3px var(--lift)}
/* While the card needs you, its top edge carries first light: sky into the mark's sun. */
main[data-state=awaiting_user]{background:linear-gradient(90deg,var(--sky1),var(--sky2) 72%,var(--sun)) top/100% 2px no-repeat,var(--bg)}
.heading{display:flex;align-items:center;gap:10px;min-width:0}
/* The sprout Y and its rising sun on a white tile; when a request is closed the tile quiets and the sun goes down. */
.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#fff,#eff8fe);box-shadow:inset 0 0 0 1px #d5e6f2;flex:none}
.mark img{width:26px;height:26px;display:block;border-radius:7px}
main[data-state=denied] .mark,main[data-state=expired] .mark{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
main[data-state=denied] .mark img,main[data-state=expired] .mark img{filter:grayscale(.75);opacity:.55}

h1{font-size:14px;line-height:1.4;font-weight:600;margin:0;min-width:0;text-wrap:balance}
.status{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:600}
.status:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%}
main[data-state=awaiting_user] .status:before{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--ring)}50%{box-shadow:0 0 0 5px transparent}}
p{margin:7px 0 0;text-wrap:pretty}
#target{color:var(--muted);font:11.5px/1.6 "Cascadia Mono",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#impact{color:var(--ink);font-size:12.5px;max-width:88ch}
.footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
button{font:600 12.5px/1.4 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;border-radius:9px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);padding:8px 14px;min-height:34px;cursor:pointer;white-space:nowrap;transition:background-color .15s,filter .15s,box-shadow .15s}
#once{background:linear-gradient(135deg,var(--act1),var(--act2));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--lift)}
#chat{background:var(--tint);border-color:var(--tint-line);color:var(--tint-ink)}
#deny{color:var(--ink)}
button:hover:enabled{filter:brightness(.97)}#once:hover:enabled{filter:brightness(1.08)}#deny:hover:enabled{background:var(--soft)}button:active:enabled{filter:brightness(.92)}
button:disabled{opacity:.5;cursor:default;box-shadow:none}
button:focus-visible,summary:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px;box-shadow:0 0 0 6px var(--ring)}
details{font-size:12px;color:var(--muted)}
summary{cursor:pointer;width:max-content;line-height:28px;border-radius:6px}
details[open]{width:100%;order:3}
dl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:7px 12px;margin:10px 0 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
dd{margin:0;overflow-wrap:anywhere;color:var(--ink)}
#risk{color:var(--risk)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:220px;overflow:auto;font:11px/1.6 "Cascadia Mono",Consolas,monospace}
#note{font-size:11.5px;color:var(--muted);margin-top:9px}#note:empty{display:none}
#notify{margin-top:9px;font-size:12px}
main[data-state=awaiting_user] .status,main[data-state=succeeded] .status{color:var(--accent)}
main[data-state=failed] .status,main[data-state=unknown] .status{color:var(--risk)}
main[data-state=succeeded],main[data-state=denied],main[data-state=expired]{padding-block:10px}
main[data-state=succeeded] #impact,main[data-state=denied] #impact,main[data-state=expired] #impact{display:none}
main[data-state=succeeded] .footer,main[data-state=denied] .footer,main[data-state=expired] .footer{margin-top:3px}
main[data-state=succeeded]:not([data-delivery=unconfirmed]) #note,main[data-state=denied]:not([data-delivery=unconfirmed]) #note{display:none}
@media(max-width:480px){main{padding:12px}.heading{gap:8px}.status{font-size:10.5px}.actions{width:100%;margin-left:0}button{flex:1;padding-inline:9px}h1{font-size:13px}dl{grid-template-columns:66px minmax(0,1fr)}}
@media(prefers-color-scheme:dark){:root{--bg:#0f2133;--ink:#e6f1fa;--muted:#9db4c8;--line:#1e3a55;--edge:#2b4c6b;--soft:#13283d;--accent:#7dd3fc;--sky2:#0369a1;--tint:#0f3550;--tint-line:#1d5a80;--tint-ink:#bae6fd;--risk:#f5c27a;--ring:rgba(56,189,248,.3);--lift:rgba(0,0,0,.35)}}
@media(prefers-reduced-motion:reduce){*{transition:none;animation:none!important}}
