h1{font-size:14px;line-height:1.4;font-weight:600;margin:0;min-width:0;text-wrap:balance}

#deny{color:var(--ink)}
button:hover:enabled{filter:brightness(.97)}#once:hover:enabled{filter:brightness(.98)}#deny:hover:enabled{background:var(--soft)}button:active:enabled{filter:brightness(.92)}
button:disabled{opacity:.5;cursor:default;box-shadow:none}
button:focus-visible,summary:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px;box-shadow:0 0 0 6px var(--ring)}
details{font-size:12px;color:var(--muted)}

details[open]{width:100%;order:3}

dd{margin:0;overflow-wrap:anywhere;color:var(--ink)}
#risk{color:var(--risk)}

#note{font-size:11.5px;color:var(--muted);margin-top:9px}#note:empty{display:none}

main[data-state=awaiting_user] .status,main[data-state=succeeded] .status{color:var(--accent)}
main[data-state=failed] .status,main[data-state=unknown] .status{color:var(--risk)}
main[data-state=succeeded],main[data-state=denied],main[data-state=expired]{padding-block:10px}
main[data-state=succeeded] #impact,main[data-state=denied] #impact,main[data-state=expired] #impact{display:none}
main[data-state=succeeded] .footer,main[data-state=denied] .footer,main[data-state=expired] .footer{margin-top:3px}
main[data-state=succeeded]:not([data-delivery=unconfirmed]) #note,main[data-state=denied]:not([data-delivery=unconfirmed]) #note{display:none}
@media(max-width:480px){main{padding:12px}.heading{gap:8px}.status{font-size:11px}.actions{width:100%;margin-left:0}button{flex:1;padding-inline:9px}h1{font-size:13px}dl{grid-template-columns:66px minmax(0,1fr)}}
